name: ios-build

# Builds the iOS app shells unsigned on a macOS runner (latest Xcode) after `pod install`, and keeps the regenerated
# Pods, the logs and the unsigned IPA as artifacts. No signing, no upload to any store.
# Manual: Actions > ios-build > Run workflow. Or push a branch named ci/build-ios-*.
# The ads template (siberian/var/apps/ionic/ios) does not archive today (Copy XCFrameworks); it is off unless asked.
on:
  workflow_dispatch:
    inputs:
      include_ads:
        description: Also build the ads template (known to fail)
        type: boolean
        default: false
  push:
    branches: ['ci/build-ios-**']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        template:
          - siberian/var/apps/ionic/ios-noads
          - ionic/platforms/ios
          - siberian/var/apps/ionic/ios
    steps:
      - name: Skip the ads template unless asked
        id: gate
        run: |
          if [ "${{ matrix.template }}" = "siberian/var/apps/ionic/ios" ] && [ "${{ inputs.include_ads }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          sparse-checkout: |
            ${{ matrix.template }}
          sparse-checkout-cone-mode: true

      - name: Select the latest Xcode
        if: steps.gate.outputs.skip != 'true'
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version

      - name: pod install
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ matrix.template }}
        run: |
          set -o pipefail
          pod install 2>&1 | tee "$RUNNER_TEMP/pod-install.log"
          grep -n "OneSignal" Podfile.lock | head -5

      - name: Archive unsigned
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ matrix.template }}
        run: |
          set -o pipefail
          xcodebuild -workspace AppsMobileCompany.xcworkspace -scheme AppsMobileCompany \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 400 | grep -E "error:|BUILD|ARCHIVE" | tail -n 60

      - name: Unsigned IPA and its minimum iOS
        if: steps.gate.outputs.skip != 'true' && success()
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/ipa/Payload/"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$RUNNER_TEMP/ipa/Payload/"*.app/Info.plist
          (cd "$RUNNER_TEMP/ipa" && zip -qry ../App-unsigned.ipa Payload)

      - name: Collect the regenerated Pods and logs
        if: always() && steps.gate.outputs.skip != 'true'
        working-directory: ${{ matrix.template }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          tar czf "$RUNNER_TEMP/out/pods-regenerated.tgz" Podfile Podfile.lock Pods/Manifest.lock Pods/Pods.xcodeproj "Pods/Target Support Files" 2>/dev/null || true
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/out/" 2>/dev/null || true
          cp "$RUNNER_TEMP/App-unsigned.ipa" "$RUNNER_TEMP/out/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: ios-${{ strategy.job-index }}
          path: ${{ runner.temp }}/out
          retention-days: 7
