# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\Next\:
    resource: '%kernel.project_dir%/src/Next/'

  App\Legacy\:
    resource: '%kernel.project_dir%/src/Legacy/'

  # add plugin routing loader
  App\Next\Plugin\Routing\PluginLoader:
    tags: [ 'routing.loader' ]
    arguments:
      $fileLocator: '@file_locator'

  App\Next\Plugin\DependencyInjection\Compiler\PluginPass:
    tags:
      - { name: kernel.compiler_pass }

  App\Next\Plugin\EventSubscriber\TwigNamespaceSubscriber:
    arguments:
      $twig: '@twig'
      $pluginNamespaces: '%plugin_namespaces%'
    tags:
      - { name: kernel.event_subscriber }

#  App\Next\Plugin\Service\PluginManager:
#    public: true
#    arguments:
#      $projectDir: '%kernel.project_dir%'
#      $cache: '@cache.app'
#      $container: '@service_container' # Inject the service container
#      $twig: '@twig'

  App\Next\Core\Service\SchemaService:
    arguments:
      $defaultConnection: '@doctrine.dbal.default_connection'
      $legacyConnection: '@doctrine.dbal.legacy_connection'

  # Add bundle twig ux components Live
  Siberian\TwigDesignSystemBundle\Components\:
    resource: '%kernel.project_dir%/vendor/siberian/twig-design-system-bundle/src/Components'
    tags: [ 'twig.component' ]
