name: sibtest

# End-to-end rig for the module update flow: Siberian (PHP 8.2) talks over real TLS to the
# downloader branch (PHP 8.5) through a private CA. Licence services are faked. Nothing here is
# reachable from outside the box except 127.0.0.1:28800.
networks:
  n: {}

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: siberian
    networks: [n]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30

  tls:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    networks:
      n:
        aliases: [downloader.test, services.test, store.test]
    depends_on: [dl, fake]

  dl:
    build: {context: ., dockerfile: Dockerfile.dl}
    image: sibtest-dl
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./downloader:/app
      - ./e2e:/e2e:ro
      - ./certs:/certs:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-test.ini:ro
    command: php -S 0.0.0.0:8080 -t public /e2e/router-dl.php
    networks: [n]

  fake:
    image: sibtest-dl
    user: "1000:1000"
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-test.ini:ro
    command: php -S 0.0.0.0:8081 /e2e/fake.php
    networks: [n]
    depends_on: [dl]

  siberian:
    build: {context: ., dockerfile: Dockerfile.sib}
    image: sibtest-sib
    user: "1000:1000"
    working_dir: /srv/sib
    volumes:
      - ${SIB_SRC:-/home/claude/siberian-module-updates/siberian}:/srv/sib
      - ./e2e:/e2e:ro
      - ./certs:/certs:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-test.ini:ro
    command: php -S 0.0.0.0:8000 -t /srv/sib /e2e/router-sib.php
    ports: ["127.0.0.1:28800:8000"]
    networks: [n]
    depends_on:
      db: {condition: service_healthy}
      tls: {condition: service_started}
