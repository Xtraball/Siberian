# Siberian CMS: nginx (web) -> php-fpm (app) -> MariaDB, plus the cron loop.
#
#   cp .env.example .env      # set the passwords
#   docker compose up -d --build
#   open http://localhost:8080  and follow the installer
#
# The database is the stock mariadb image. The docroot lives in the `siberian` volume, seeded from the app image on
# first start: the installer, the in-app updater and the uploads write there (docker/README.md explains the lifecycle).
name: siberian

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set it in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-siberian}
      MARIADB_USER: ${MARIADB_USER:-siberian}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set it in .env}
    # Siberian is Zend 1 code: relaxed sql_mode like its historical MySQL 5.x setups, utf8mb4, big packets for the app builds
    command: >
      --sql-mode=NO_ENGINE_SUBSTITUTION
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=256M
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: ${SIBERIAN_APP_IMAGE:-siberian-app:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - siberian:/var/www/html

  cron:
    image: ${SIBERIAN_APP_IMAGE:-siberian-app:local}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: ["cron"]
    healthcheck:
      disable: true
    volumes:
      - siberian:/var/www/html

  web:
    image: ${SIBERIAN_WEB_IMAGE:-siberian-web:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${SIBERIAN_PORT:-8080}:80"
    volumes:
      - siberian:/var/www/html:ro

volumes:
  db:
  siberian:
